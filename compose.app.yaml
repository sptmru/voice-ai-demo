# App services. Start using both compose files; PostgreSQL has no host port.
services:
  api:
    build: .
    image: relay-voice-support:local
    env_file: .env
    environment:
      # Use the same POSTGRES_* values as db; override any host-only URL from .env.
      DATABASE_URL: ''
      DB_HOST: db
      DB_PORT: 5432
      HOST: 0.0.0.0
      PORT: 3101
      EMBEDDING_CACHE: /app/.cache/models
    volumes:
      - relay_models:/app/.cache/models
    networks:
      - default
      - database
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3101/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
  web:
    image: relay-voice-support:local
    command: ['pnpm', '--dir', 'apps/web', 'start']
    environment:
      API_INTERNAL_URL: http://api:3101
    ports:
      - '127.0.0.1:${PORT:-3100}:3100'
    depends_on:
      - api
    init: true
    restart: unless-stopped
volumes:
  relay_models:
