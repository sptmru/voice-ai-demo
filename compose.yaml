name: relay-voice-demo
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_local
      POSTGRES_DB: relay
    ports:
      - '127.0.0.1:${DB_PORT:-55432}:5432'
    volumes:
      - relay_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relay -d relay']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  relay_pg:
